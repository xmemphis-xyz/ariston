create_vacation:
  name: Create vacation
  description: >-
    Create a vacation on the selected device. If end date is not specified, the
    vacation is going to be deleted.
  fields:
    device_id:
      name: Device
      description: Ariston device on which to create the vacation.
      required: true
      selector:
        device:
          integration: ariston_nimbus
    end_date:
      name: End date
      description: Date the vacation ends in the YYYY-mm-dd format.
      selector:
        text:
set_item_by_id:
  name: Set item by id
  description: Ariston device or thermostat property
  fields:
    device_id:
      name: Device
      description: Ariston device on which to set item.
      required: true
      selector:
        device:
          integration: ariston_nimbus
    item_id:
      name: Device or thermostat property
      description: Ariston device or thermostat property
      required: true
      selector:
        select:
          options:
            - "AutomaticThermoregulation"
            - "DhwMode"
            - "DhwTemp"
            - "PlantMode"
            - "AntilegionellaOnOff"
            - "AntilegionellaTemp"
            - "AntilegionellaFreq"
            - "ZoneComfortTemp"
            - "ZoneEconomyTemp"
            - "ZoneMode"
            - "ZoneDeroga"
            - "VirtTempOffsetHeat"
    zone:
      name: Thermostat zone
      description: Number of the zone. Set 0 if device.
      required: true
      selector:
        number:
          min: 0
          max: 100
    value:
      name: Value
      description: Value of the setting.
      required: true
      example: "1"
      selector:
        text:
scan_menu_items:
  name: Scan technical menu
  description: >-
    Scan Ariston technical-menu items in the background to find the heat-pump
    operating parameters your device reports. The result is shown in a
    notification, saved to ariston_nimbus_menu_scan.json in the config folder
    and included in Download diagnostics.
  fields:
    device_id:
      name: Device
      description: Ariston device to scan. Leave empty to scan all GALEVO devices.
      required: false
      selector:
        device:
          integration: ariston_nimbus
    first_id:
      name: First item id
      description: First menu item id to scan.
      default: 1
      selector:
        number:
          min: 1
          max: 5000
          mode: box
    last_id:
      name: Last item id
      description: Last menu item id to scan.
      default: 500
      selector:
        number:
          min: 1
          max: 5000
          mode: box
